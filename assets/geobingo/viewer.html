<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Geobingo</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee;
    font: 14px system-ui, -apple-system, Roboto, sans-serif; overflow: hidden; }
  #pano, #map { position: absolute; inset: 0; }
  #mapwrap { position: absolute; inset: 0; display: none; background: #222; }
  #mapwrap.open { display: block; }
  #search { position: absolute; top: 8px; left: 8px; right: 8px; display: flex;
    gap: 6px; z-index: 5; }
  #search input { flex: 1; min-width: 0; padding: 9px 10px; border-radius: 8px;
    border: 0; font-size: 15px; }
  button { padding: 9px 12px; border-radius: 8px; border: 0; font-size: 15px;
    background: #1e88e5; color: #fff; }
  #toggle { position: absolute; left: 8px; bottom: 8px; z-index: 6;
    box-shadow: 0 2px 6px #0008; }
  #hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: #000a; padding: 10px 14px; border-radius: 10px; text-align: center;
    max-width: 80%; z-index: 7; display: none; }
  #pickhint { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); z-index: 5;
    white-space: nowrap;
    background: #000a; padding: 6px 10px; border-radius: 8px; }
</style>
</head>
<body>
<div id="pano"></div>
<div id="mapwrap">
  <div id="map"></div>
  <form id="search" onsubmit="searchPlace(event)">
    <input id="q" placeholder="Ort suchen, z. B. Tokio" autocomplete="off">
    <button type="submit">Los</button>
  </form>
  <div id="pickhint">Tippe auf eine Straße</div>
</div>
<button id="toggle" onclick="toggleMap()">🗺️ Karte</button>
<div id="hint"></div>
<script>
'use strict';
let cfg = null;
let viewer = null;   // Google StreetViewPanorama or Mapillary Viewer
let map = null;
let svService = null;
let hasPicture = false;

function send(o) {
  const s = JSON.stringify(o);
  if (window.GeoBridge) window.GeoBridge.postMessage(s);
  else if (window.parent !== window) window.parent.postMessage({ geobingo: s }, '*');
}

function hint(text, ms) {
  const h = document.getElementById('hint');
  h.textContent = text;
  h.style.display = text ? 'block' : 'none';
  if (ms) setTimeout(() => { if (h.textContent === text) hint(''); }, ms);
}

function openMap(open) {
  document.getElementById('mapwrap').classList.toggle('open', open);
  document.getElementById('toggle').textContent = open ? '🧍 Straße' : '🗺️ Karte';
  document.getElementById('toggle').style.display =
    cfg && cfg.mode === 'hunt' && (hasPicture || !open) ? 'block' : 'none';
  if (open && map) setTimeout(() => {
    if (map.resize) map.resize();
    if (cfg.source === 'google') google.maps.event.trigger(map, 'resize');
  }, 50);
}

function toggleMap() {
  openMap(!document.getElementById('mapwrap').classList.contains('open'));
}

function loadScript(src) {
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = src; s.async = true; s.onload = ok;
    s.onerror = () => fail(new Error('Laden fehlgeschlagen: ' + src));
    document.head.appendChild(s);
  });
}

function loadCss(href) {
  const l = document.createElement('link');
  l.rel = 'stylesheet'; l.href = href;
  document.head.appendChild(l);
}

async function fetchJson(url, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms || 8000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally {
    clearTimeout(timer);
  }
}

/// Country of a place via OpenStreetMap (free, no key); '' if unknown.
async function countryOf(lat, lng) {
  try {
    const j = await fetchJson('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=3'
      + '&lat=' + lat + '&lon=' + lng, 6000);
    return (j.address && j.address.country_code) || '';
  } catch (e) {
    return '';
  }
}

async function searchPlace(ev) {
  ev.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  document.getElementById('q').blur();
  try {
    const r = await fetchJson('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='
      + encodeURIComponent(q));
    if (!r.length) { hint('Nichts gefunden', 1500); return; }
    const lat = +r[0].lat, lng = +r[0].lon;
    if (cfg.source === 'google') { map.setCenter({ lat, lng }); map.setZoom(14); }
    else map.jumpTo({ center: [lng, lat], zoom: 14 });
  } catch (e) {
    hint('Suche fehlgeschlagen', 1500);
  }
}

// ---------------------------------------------------------------- Google

window.gm_authFailure = () => send({ t: 'error', msg: 'Der Google-Schlüssel wurde abgelehnt.' });

async function initGoogle() {
  await loadScript('https://maps.googleapis.com/maps/api/js?v=weekly&loading=async&callback=Function.prototype&key='
    + encodeURIComponent(cfg.key));
  while (!(window.google && google.maps && google.maps.importLibrary)) {
    await new Promise(r => setTimeout(r, 50));
  }
  const sv = await google.maps.importLibrary('streetView');
  const maps = await google.maps.importLibrary('maps');
  const hunt = cfg.mode === 'hunt';
  const opts = {
    addressControl: false, showRoadLabels: false, fullscreenControl: false,
    motionTracking: false, motionTrackingControl: false,
    linksControl: hunt, clickToGo: hunt, enableCloseButton: false,
    panControl: false, zoomControl: true,
  };
  const make = () => {
    if (!viewer) viewer = new sv.StreetViewPanorama(document.getElementById('pano'), opts);
    return viewer;
  };
  if (hunt) {
    svService = new sv.StreetViewService();
    map = new maps.Map(document.getElementById('map'), {
      center: { lat: 30, lng: 10 }, zoom: 2, streetViewControl: false,
      mapTypeControl: false, fullscreenControl: false, clickableIcons: false,
      gestureHandling: 'greedy',
    });
    new sv.StreetViewCoverageLayer().setMap(map);
    map.addListener('click', async (e) => {
      try {
        const res = await svService.getPanorama({
          location: e.latLng, radius: 300,
          preference: sv.StreetViewPreference.NEAREST,
          sources: [sv.StreetViewSource.OUTDOOR],
        });
        make().setPano(res.data.location.pano);
        make().setPov({ heading: 0, pitch: 0 });
        hasPicture = true;
        openMap(false);
      } catch (err) {
        hint('Hier gibt es kein Street View – tippe auf eine blaue Linie', 2000);
      }
    });
    openMap(true);
  }
  send({ t: 'ready' });
}

function googleView() {
  const p = viewer.getPosition();
  const pov = viewer.getPov();
  return { src: 'google', id: viewer.getPano(), lat: p.lat(), lng: p.lng(),
    h: pov.heading, p: pov.pitch, z: viewer.getZoom() || 1 };
}

function googleShow(v) {
  if (!viewer) {
    viewer = new google.maps.StreetViewPanorama(document.getElementById('pano'), {
      addressControl: false, showRoadLabels: false, fullscreenControl: false,
      motionTracking: false, motionTrackingControl: false, linksControl: false,
      clickToGo: false, panControl: false, zoomControl: true,
    });
  }
  viewer.setPano(v.id);
  viewer.setPov({ heading: v.h || 0, pitch: v.p || 0 });
  viewer.setZoom(v.z || 1);
}

// ------------------------------------------------------------- Mapillary

async function initMapillary() {
  loadCss('https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css');
  await loadScript('https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js');
  const hunt = cfg.mode === 'hunt';
  viewer = new mapillary.Viewer({
    accessToken: cfg.key, container: 'pano',
    component: { cover: false, bearing: true, zoom: true,
      sequence: hunt, direction: hunt, keyboard: hunt },
  });
  viewer.on('image', () => { hasPicture = true; });
  if (hunt) {
    loadCss('https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css');
    await loadScript('https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js');
    map = new maplibregl.Map({
      container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [10, 30], zoom: 1.5, attributionControl: { compact: true },
    });
    map.on('load', () => {
      map.addSource('mly', {
        type: 'vector', maxzoom: 14,
        tiles: ['https://tiles.mapillary.com/maps/vtp/mly1_public/2/{z}/{x}/{y}?access_token='
          + encodeURIComponent(cfg.key)],
      });
      map.addLayer({ id: 'mly-seq', type: 'line', source: 'mly', 'source-layer': 'sequence',
        paint: { 'line-color': '#05cb63', 'line-width': 2, 'line-opacity': 0.8 } });
      map.addLayer({ id: 'mly-img', type: 'circle', source: 'mly', 'source-layer': 'image',
        minzoom: 14, paint: { 'circle-color': '#05cb63', 'circle-radius': 3 } });
    });
    map.on('click', async (e) => {
      const { lng, lat } = e.lngLat;
      try {
        let best = null;
        for (const d of [0.002, 0.01]) {
          const r = await fetchJson('https://graph.mapillary.com/images?fields=id,computed_geometry,geometry&limit=50'
            + '&bbox=' + [lng - d, lat - d, lng + d, lat + d].join(',')
            + '&access_token=' + encodeURIComponent(cfg.key));
          for (const img of r.data || []) {
            const g = img.computed_geometry || img.geometry;
            if (!g) continue;
            const dist = Math.hypot(g.coordinates[0] - lng, g.coordinates[1] - lat);
            if (!best || dist < best.dist) best = { id: img.id, dist };
          }
          if (best) break;
        }
        if (!best) { hint('Hier gibt es keine Bilder – tippe auf eine grüne Linie', 2000); return; }
        await viewer.moveTo(best.id);
        hasPicture = true;
        openMap(false);
      } catch (err) {
        hint('Bild konnte nicht geladen werden', 2000);
      }
    });
    openMap(true);
  }
  send({ t: 'ready' });
}

async function mapillaryView() {
  const img = await viewer.getImage();
  const c = await viewer.getCenter();
  const z = await viewer.getZoom();
  const ll = img.lngLat || img.originalLngLat;
  return { src: 'mapillary', id: img.id, lat: ll.lat, lng: ll.lng, h: c[0], p: c[1], z };
}

async function mapillaryShow(v) {
  await viewer.moveTo(v.id);
  viewer.setCenter([v.h, v.p]);
  viewer.setZoom(v.z || 0);
}

// ------------------------------------------------------------- messages

async function receive(json) {
  const m = typeof json === 'string' ? JSON.parse(json) : json;
  try {
    switch (m.t) {
      case 'init':
        cfg = m;
        if (!cfg.key) { send({ t: 'error', msg: 'Kein Schlüssel für ' + cfg.source }); return; }
        if (cfg.source === 'google') await initGoogle(); else await initMapillary();
        break;
      case 'mark': {
        if (!viewer || !hasPicture) { send({ t: 'marked', req: m.req, error: 'Erst einen Ort auf der Karte wählen' }); return; }
        const v = cfg.source === 'google' ? googleView() : await mapillaryView();
        v.cc = await countryOf(v.lat, v.lng);
        send({ t: 'marked', req: m.req, view: v });
        break;
      }
      case 'show':
        hasPicture = true;
        if (cfg.source === 'google') googleShow(m.view); else await mapillaryShow(m.view);
        break;
    }
  } catch (e) {
    send({ t: m.t === 'mark' ? 'marked' : 'error', req: m.req, error: String(e && e.message || e), msg: String(e && e.message || e) });
  }
}

window.geobingo = { receive };
window.addEventListener('message', (e) => {
  if (e.data && typeof e.data.geobingoIn === 'string') receive(e.data.geobingoIn);
});
document.getElementById('toggle').style.display = 'none';
send({ t: 'loaded' });
</script>
</body>
</html>
