<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Street View</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
  "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.15.1/index.module.js"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee;
    font: 14px system-ui, -apple-system, Roboto, sans-serif; overflow: hidden; }
  .layer { position: absolute; inset: 0; visibility: hidden; }
  .layer.on { visibility: visible; }
  .fill { width: 100%; height: 100%; }
  #flat { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #map { position: absolute; inset: 0; }
  #mapwrap { position: absolute; inset: 0; display: none; background: #222; z-index: 4; }
  #mapwrap.open { display: block; }
  #search { position: absolute; top: 8px; left: 8px; right: 8px; display: flex;
    gap: 6px; z-index: 5; }
  #search input { flex: 1; min-width: 0; padding: 9px 10px; border-radius: 8px;
    border: 0; font-size: 15px; }
  button { padding: 9px 12px; border-radius: 8px; border: 0; font-size: 15px;
    background: #1e88e5; color: #fff; }
  button:disabled { opacity: 0.4; }
  #toggle { position: absolute; left: 8px; bottom: 8px; z-index: 6;
    box-shadow: 0 2px 6px #0008; display: none; }
  #hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: #000a; padding: 10px 14px; border-radius: 10px; text-align: center;
    max-width: 80%; z-index: 7; display: none; }
  #seqnav { position: absolute; right: 8px; bottom: 8px; z-index: 3; display: none; gap: 6px; }
  #pickhint { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); z-index: 5;
    white-space: nowrap; background: #000a; padding: 6px 10px; border-radius: 8px; }
  .pin { padding: 2px 6px; border-radius: 6px; background: #1e88e5; color: #fff;
    font-weight: bold; font-size: 12px; white-space: nowrap; box-shadow: 0 1px 4px #0008; }
  .pin.truth { background: #e53935; }
</style>
</head>
<body>
<div id="gsv" class="layer"></div>
<!-- The viewers style their own container (position: relative), so each
     gets an inner one that fills the layer. -->
<div id="mly" class="layer"><div id="mlyview" class="fill"></div></div>
<div id="psv" class="layer"><div id="psvview" class="fill"></div></div>
<div id="flatwrap" class="layer"><img id="flat" alt=""></div>
<div id="seqnav">
  <button id="prev" onclick="photoStep('prev')">◀</button>
  <button id="next" onclick="photoStep('next')">▶</button>
</div>
<div id="mapwrap">
  <div id="map"></div>
  <form id="search" onsubmit="searchPlace(event)">
    <input id="q" placeholder="Ort suchen, z. B. Tokio" autocomplete="off">
    <button type="submit">Los</button>
  </form>
  <div id="pickhint">Tippe auf eine Straße</div>
</div>
<button id="toggle" onclick="toggleMap()">🗺️ Karte</button>
<div id="hint"></div>
<script>
'use strict';
let cfg = null;           // {sources, keys, mode}
let map = null;           // Google map or MapLibre map
let current = null;       // source of the picture on screen
let guessMarker = null;
let resultMarkers = [];

const PNX = 'https://api.panoramax.xyz/api';
const google_ = { sv: null, maps: null, pano: null, service: null };
const mly = { viewer: null };
const photo = { psv: null, item: null, flat: false, loading: false };
const PHOTOS = ['panoramax', 'kartaview'];

function send(o) {
  const s = JSON.stringify(o);
  if (window.GeoBridge) window.GeoBridge.postMessage(s);
  else if (window.parent !== window) window.parent.postMessage({ geobingo: s }, '*');
}

function hint(text, ms) {
  const h = document.getElementById('hint');
  h.textContent = text;
  h.style.display = text ? 'block' : 'none';
  if (ms) setTimeout(() => { if (h.textContent === text) hint(''); }, ms);
}

function useLibre() { return !(cfg.sources.length === 1 && cfg.sources[0] === 'google') || cfg.mode === 'guess'; }

function mapOpen() { return document.getElementById('mapwrap').classList.contains('open'); }

function openMap(open) {
  document.getElementById('mapwrap').classList.toggle('open', open);
  const t = document.getElementById('toggle');
  if (cfg.mode === 'guess') {
    t.textContent = open ? '🧍 Zum Bild' : '🗺️ Tippen';
    t.style.display = current ? 'block' : 'none';
  } else {
    t.textContent = open ? '🧍 Straße' : '🗺️ Karte';
    t.style.display = cfg.mode === 'hunt' && current ? 'block' : 'none';
  }
  if (open && map) setTimeout(() => {
    if (map.resize) map.resize();
    else if (window.google) google.maps.event.trigger(map, 'resize');
  }, 50);
}

function toggleMap() { openMap(!mapOpen()); }

/// Shows the layer of [src] and hides the others.
function display(src) {
  current = src;
  const on = {
    gsv: src === 'google', mly: src === 'mapillary',
    psv: PHOTOS.includes(src) && !photo.flat, flatwrap: PHOTOS.includes(src) && photo.flat,
  };
  for (const [id, v] of Object.entries(on)) document.getElementById(id).classList.toggle('on', v);
  document.getElementById('seqnav').style.display =
    PHOTOS.includes(src) && cfg.mode === 'hunt' && photo.item ? 'flex' : 'none';
}

function loadScript(src) {
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = src; s.async = true; s.onload = ok;
    s.onerror = () => fail(new Error('Laden fehlgeschlagen: ' + src));
    document.head.appendChild(s);
  });
}

const cssLoaded = new Set();
function loadCss(href) {
  if (cssLoaded.has(href)) return;
  cssLoaded.add(href);
  const l = document.createElement('link');
  l.rel = 'stylesheet'; l.href = href;
  document.head.appendChild(l);
}

async function fetchJson(url, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms || 8000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally {
    clearTimeout(timer);
  }
}

/// Country of a place via OpenStreetMap (free, no key); '' if unknown.
async function countryOf(lat, lng) {
  try {
    const j = await fetchJson('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=3'
      + '&lat=' + lat + '&lon=' + lng, 6000);
    return (j.address && j.address.country_code) || '';
  } catch (e) {
    return '';
  }
}

async function searchPlace(ev) {
  ev.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  document.getElementById('q').blur();
  try {
    const r = await fetchJson('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='
      + encodeURIComponent(q));
    if (!r.length) { hint('Nichts gefunden', 1500); return; }
    const lat = +r[0].lat, lng = +r[0].lon;
    if (map.jumpTo) map.jumpTo({ center: [lng, lat], zoom: 14 });
    else { map.setCenter({ lat, lng }); map.setZoom(14); }
  } catch (e) {
    hint('Suche fehlgeschlagen', 1500);
  }
}

/// The candidate closest to (lng, lat) among {id, c: [lng, lat], ...}.
function nearest(list, lng, lat) {
  let best = null, bestD = Infinity;
  for (const x of list) {
    if (!x) continue;
    const d = Math.hypot(x.c[0] - lng, x.c[1] - lat);
    if (d < bestD) { bestD = d; best = x; }
  }
  return best;
}

function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

// ---------------------------------------------------------------- Google

window.gm_authFailure = () => send({ t: 'error', msg: 'Der Google-Schlüssel wurde abgelehnt.' });

async function ensureGoogle() {
  if (google_.sv) return;
  await loadScript('https://maps.googleapis.com/maps/api/js?v=weekly&loading=async&callback=Function.prototype&key='
    + encodeURIComponent(cfg.keys.google || ''));
  while (!(window.google && google.maps && google.maps.importLibrary)) {
    await new Promise(r => setTimeout(r, 50));
  }
  google_.sv = await google.maps.importLibrary('streetView');
  google_.maps = await google.maps.importLibrary('maps');
  google_.service = new google_.sv.StreetViewService();
}

function googlePano() {
  if (!google_.pano) {
    const hunt = cfg.mode === 'hunt';
    google_.pano = new google_.sv.StreetViewPanorama(document.getElementById('gsv'), {
      addressControl: false, showRoadLabels: false, fullscreenControl: false,
      motionTracking: false, motionTrackingControl: false,
      linksControl: hunt, clickToGo: hunt, enableCloseButton: false,
      panControl: false, zoomControl: true,
    });
  }
  return google_.pano;
}

/// The Google panorama nearest to a point within [radius] metres, or null.
async function googleNear(lng, lat, radius) {
  await ensureGoogle();
  try {
    const res = await google_.service.getPanorama({
      location: { lat, lng }, radius,
      preference: google_.sv.StreetViewPreference.NEAREST,
      sources: [google_.sv.StreetViewSource.OUTDOOR],
    });
    const l = res.data.location;
    return { src: 'google', id: l.pano, c: [l.latLng.lng(), l.latLng.lat()] };
  } catch (e) {
    return null;
  }
}

async function googleShow(id, v) {
  await ensureGoogle();
  const p = googlePano();
  p.setPano(id);
  p.setPov({ heading: v ? v.h || 0 : 0, pitch: v ? v.p || 0 : 0 });
  p.setZoom(v ? v.z || 1 : 1);
  display('google');
}

function googleView() {
  const p = google_.pano, pos = p.getPosition(), pov = p.getPov();
  return { src: 'google', id: p.getPano(), lat: pos.lat(), lng: pos.lng(),
    h: pov.heading, p: pov.pitch, z: p.getZoom() || 1 };
}

// ------------------------------------------------------------- Mapillary

async function ensureMapillary() {
  if (mly.viewer) return;
  loadCss('https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css');
  await loadScript('https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js');
  const hunt = cfg.mode === 'hunt';
  mly.viewer = new mapillary.Viewer({
    accessToken: cfg.keys.mapillary, container: 'mlyview',
    component: { cover: false, bearing: true, zoom: true,
      sequence: hunt, direction: hunt, keyboard: hunt },
  });
}

async function mapillaryNear(lng, lat, sizes, panoOnly) {
  for (const d of sizes) {
    const r = await fetchJson('https://graph.mapillary.com/images?fields=id,computed_geometry,geometry&limit=50'
      + (panoOnly ? '&is_pano=true' : '')
      + '&bbox=' + [lng - d, lat - d, lng + d, lat + d].join(',')
      + '&access_token=' + encodeURIComponent(cfg.keys.mapillary));
    const list = (r.data || []).map(img => {
      const g = img.computed_geometry || img.geometry;
      return g && { src: 'mapillary', id: img.id, c: g.coordinates };
    }).filter(Boolean);
    if (list.length) return list;
  }
  return [];
}

async function mapillaryShow(id, v) {
  await ensureMapillary();
  display('mapillary');
  await mly.viewer.moveTo(id);
  if (v && v.h != null) { mly.viewer.setCenter([v.h, v.p || 0]); mly.viewer.setZoom(v.z || 0); }
}

async function mapillaryView() {
  const img = await mly.viewer.getImage();
  const c = await mly.viewer.getCenter();
  const z = await mly.viewer.getZoom();
  const ll = img.lngLat || img.originalLngLat;
  return { src: 'mapillary', id: img.id, lat: ll.lat, lng: ll.lng, h: c[0], p: c[1], z };
}

// ------------------------------------------- photos: Panoramax, KartaView

/// Both are free collections of single photos (some of them 360°), shown
/// with Photo Sphere Viewer or as a plain picture. An item is normalised
/// to {src, id, lat, lng, url, is360, raw}.

async function pnxItem(id) {
  const j = await fetchJson(PNX + '/search?ids=' + encodeURIComponent(id));
  const f = j.features && j.features[0];
  if (!f) throw new Error('Bild nicht gefunden');
  return pnxNormal(f);
}

function pnxIs360(f) {
  const o = f.properties['pers:interior_orientation'] || {};
  if (o.field_of_view === 360) return true;
  const d = o.sensor_array_dimensions;
  return !!(d && d[0] === 2 * d[1]);
}

function pnxNormal(f) {
  const is360 = pnxIs360(f);
  const a = f.assets || {};
  const [lng, lat] = f.geometry.coordinates;
  return { src: 'panoramax', id: f.id, lat, lng, is360, raw: f,
    url: ((is360 ? a.hd || a.sd : a.sd || a.hd) || {}).href };
}

async function panoramaxNear(lng, lat, sizes) {
  for (const d of sizes) {
    const r = await fetchJson(PNX + '/search?limit=50&bbox=' + [lng - d, lat - d, lng + d, lat + d].join(','));
    const list = (r.features || []).map(f => f.geometry
      && { src: 'panoramax', id: f.id, c: f.geometry.coordinates, is360: pnxIs360(f) }).filter(Boolean);
    if (list.length) return list;
  }
  return [];
}

const KV = 'https://api.kartaview.org/2.0';

function kvNormal(p) {
  return { src: 'kartaview', id: String(p.id), lat: +p.lat, lng: +p.lng, raw: p,
    is360: p.projection === 'SPHERE', url: p.fileurlProc || p.imageProcUrl };
}

async function kvItem(id) {
  const j = await fetchJson(KV + '/photo/' + encodeURIComponent(id));
  if (!j.result || !j.result.data) throw new Error('Bild nicht gefunden');
  return kvNormal(j.result.data);
}

/// KartaView searches a circle of at most 500 m.
async function kartaviewNear(lng, lat, sizes) {
  for (const d of sizes) {
    const radius = Math.max(20, Math.min(500, Math.round(d * 111000)));
    const j = await fetchJson(KV + '/photo/?itemsPerPage=50&lat=' + lat + '&lng=' + lng + '&radius=' + radius);
    const list = ((j.result && j.result.data) || []).map(p =>
      ({ src: 'kartaview', id: String(p.id), c: [+p.lng, +p.lat], is360: p.projection === 'SPHERE' }));
    if (list.length) return list;
  }
  return [];
}

function photoItem(src, id) { return src === 'kartaview' ? kvItem(id) : pnxItem(id); }

/// The next or previous photo of the same drive, or null.
async function photoNeighbour(rel) {
  const it = photo.item;
  if (!it) return null;
  if (it.src === 'panoramax') {
    const l = (it.raw.links || []).find(l => l.rel === rel);
    return l ? l.id : null;
  }
  const idx = +it.raw.sequenceIndex + (rel === 'next' ? 1 : -1);
  if (idx < 0) return null;
  try {
    const j = await fetchJson(KV + '/photo/?sequenceId=' + it.raw.sequenceId + '&sequenceIndex=' + idx);
    const p = j.result && j.result.data && j.result.data[0];
    return p ? String(p.id) : null;
  } catch (e) {
    return null;
  }
}

/// Shows photo [id] of [src]; [v] = {h, p, z}: yaw and pitch in degrees,
/// zoom 0–100 (360° photos only).
async function photoShow(src, id, v) {
  photo.loading = true;
  try {
    await photoLoad(src, id, v);
  } finally {
    photo.loading = false;
  }
}

async function photoLoad(src, id, v) {
  hint('Lade Bild …');
  const it = await photoItem(src, id);
  if (!it.url) throw new Error('Bild ohne Datei');
  if (it.is360) {
    const position = { yaw: ((v && v.h) || 0) * Math.PI / 180, pitch: ((v && v.p) || 0) * Math.PI / 180 };
    const zoom = v && v.z != null ? v.z : 30;
    photo.flat = false;
    display(src);
    if (!photo.psv) {
      loadCss('https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.15.1/index.min.css');
      const { Viewer } = await import('@photo-sphere-viewer/core');
      photo.psv = new Viewer({ container: document.getElementById('psvview'), panorama: it.url,
        navbar: false, loadingTxt: '' });
      await new Promise(r => photo.psv.addEventListener('ready', r, { once: true }));
    } else {
      await photo.psv.setPanorama(it.url, { position, zoom, transition: false });
    }
    // Set again once loaded: the first layout resets the view.
    photo.psv.rotate(position);
    photo.psv.zoom(zoom);
  } else {
    document.getElementById('flat').src = it.url;
    photo.flat = true;
  }
  photo.item = it;
  display(src);
  hint('');
  if (cfg.mode === 'hunt') {
    for (const rel of ['prev', 'next']) {
      const b = document.getElementById(rel);
      b.disabled = true;
      photoNeighbour(rel).then(n => { if (photo.item === it) b.disabled = !n; });
    }
  }
}

async function photoStep(rel) {
  const id = await photoNeighbour(rel);
  if (!id) return;
  try { await photoShow(photo.item.src, id); } catch (e) { hint('Bild konnte nicht geladen werden', 2000); }
}

function photoView() {
  const it = photo.item;
  const v = { src: it.src, id: it.id, lat: it.lat, lng: it.lng, h: 0, p: 0, z: 0 };
  if (!photo.flat) {
    const pos = photo.psv.getPosition();
    v.h = pos.yaw * 180 / Math.PI;
    v.p = pos.pitch * 180 / Math.PI;
    v.z = photo.psv.getZoomLevel();
  }
  return v;
}

// ----------------------------------------------------------- per source

async function showPicture(v) {
  if (v.src === 'google') await googleShow(v.id, v);
  else if (v.src === 'mapillary') await mapillaryShow(v.id, v);
  else await photoShow(v.src, v.id, v);
}

async function currentView() {
  if (current === 'google') return googleView();
  if (current === 'mapillary') return await mapillaryView();
  return photoView();
}

/// Pictures near a point from every source in play.
async function near(lng, lat, sizes) {
  const lists = await Promise.all(cfg.sources.map(async (s) => {
    try {
      if (s === 'mapillary') return await mapillaryNear(lng, lat, sizes, false);
      if (s === 'panoramax') return await panoramaxNear(lng, lat, sizes);
      if (s === 'kartaview') return await kartaviewNear(lng, lat, sizes);
      const g = await googleNear(lng, lat, 300);
      return g ? [g] : [];
    } catch (e) {
      return [];
    }
  }));
  return lists.flat();
}

// ------------------------------------------------------------------ maps

async function ensureLibre() {
  if (window.maplibregl) return;
  loadCss('https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css');
  await loadScript('https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js');
}

// KartaView draws its own (purple) lines.
const COLORS = { mapillary: '#05cb63', panoramax: '#ff6d00' };

/// The pick map of the hunt: tapping loads the nearest picture.
async function huntMap() {
  if (!useLibre()) {
    await ensureGoogle();
    map = new google_.maps.Map(document.getElementById('map'), {
      center: { lat: 30, lng: 10 }, zoom: 2, streetViewControl: false,
      mapTypeControl: false, fullscreenControl: false, clickableIcons: false,
      gestureHandling: 'greedy',
    });
    new google_.sv.StreetViewCoverageLayer().setMap(map);
    map.addListener('click', (e) => huntPick(e.latLng.lng(), e.latLng.lat()));
    document.getElementById('pickhint').textContent = 'Tippe auf eine blaue Linie';
  } else {
    openMap(true);
    await libreMap(addCoverage);
    map.on('click', (e) => huntPick(e.lngLat.lng, e.lngLat.lat));
    document.getElementById('pickhint').textContent =
      cfg.sources.length > 1 ? sourceLegend() : 'Tippe auf eine Linie';
  }
  openMap(true);
}

async function libreMap(onLoad) {
  await ensureLibre();
  map = new maplibregl.Map({
    container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [10, 30], zoom: 1.5, attributionControl: { compact: true },
  });
  // 'load' waits for a first frame, which a hidden map never draws: the
  // layers go in as soon as the style is there.
  if (onLoad) {
    let done = false;
    map.once('style.load', () => {
      if (done) return;
      done = true;
      onLoad(map);
    });
  }
}

function addCoverage(map) {
  if (cfg.sources.includes('mapillary')) {
    map.addSource('mly', {
      type: 'vector', maxzoom: 14,
      tiles: ['https://tiles.mapillary.com/maps/vtp/mly1_public/2/{z}/{x}/{y}?access_token='
        + encodeURIComponent(cfg.keys.mapillary)],
    });
    map.addLayer({ id: 'mly-seq', type: 'line', source: 'mly', 'source-layer': 'sequence',
      paint: { 'line-color': COLORS.mapillary, 'line-width': 2, 'line-opacity': 0.8 } });
    map.addLayer({ id: 'mly-img', type: 'circle', source: 'mly', 'source-layer': 'image',
      minzoom: 14, paint: { 'circle-color': COLORS.mapillary, 'circle-radius': 3 } });
  }
  if (cfg.sources.includes('panoramax')) {
    map.addSource('pnx', { type: 'vector', maxzoom: 15, tiles: [PNX + '/map/{z}/{x}/{y}.mvt'] });
    map.addLayer({ id: 'pnx-grid', type: 'fill', source: 'pnx', 'source-layer': 'grid',
      paint: { 'fill-color': COLORS.panoramax, 'fill-opacity': 0.3 } });
    map.addLayer({ id: 'pnx-seq', type: 'line', source: 'pnx', 'source-layer': 'sequences',
      paint: { 'line-color': COLORS.panoramax, 'line-width': 2, 'line-opacity': 0.8 } });
    map.addLayer({ id: 'pnx-pic', type: 'circle', source: 'pnx', 'source-layer': 'pictures',
      minzoom: 15, paint: { 'circle-color': COLORS.panoramax, 'circle-radius': 3 } });
  }
  if (cfg.sources.includes('kartaview')) {
    // Picture tiles of the drives; slow when zoomed far out.
    map.addSource('kv', { type: 'raster', tileSize: 256, minzoom: 11, maxzoom: 18,
      tiles: [KV + '/sequence/tiles/{x}/{y}/{z}.png'] });
    map.addLayer({ id: 'kv', type: 'raster', source: 'kv', minzoom: 11 });
  }
}

function sourceLegend() {
  const names = { mapillary: 'Grün: Mapillary', panoramax: 'Orange: Panoramax',
    kartaview: 'Lila: KartaView (nah ran)' };
  return cfg.sources.map(s => names[s]).filter(Boolean).join(' · ');
}

async function huntPick(lng, lat, sizes) {
  const before = current;
  try {
    hint('Suche Bild …');
    const best = nearest(await near(lng, lat, sizes || [0.002, 0.01]), lng, lat);
    if (!best) { hint('Hier gibt es keine Bilder – tippe auf eine Linie', 2000); return; }
    await showPicture({ src: best.src, id: best.id });
    hint('');
    openMap(false);
  } catch (err) {
    display(before);
    hint('Bild konnte nicht geladen werden', 2000);
  }
}

/// The guess map: tapping sets the guess marker.
async function guessMap() {
  await libreMap();
  document.getElementById('search').style.display = 'none';
  document.getElementById('pickhint').textContent = 'Tippe, wo du das Bild vermutest';
  map.on('click', (e) => {
    if (resultMarkers.length) return;
    if (!guessMarker) guessMarker = new maplibregl.Marker({ color: '#1e88e5' });
    guessMarker.setLngLat(e.lngLat).addTo(map);
  });
}

function clearResult() {
  for (const m of resultMarkers) m.remove();
  resultMarkers = [];
  if (map && map.getLayer && map.getLayer('lines')) { map.removeLayer('lines'); map.removeSource('lines'); }
}

function showResult(truth, guesses) {
  clearResult();
  if (guessMarker) { guessMarker.remove(); guessMarker = null; }
  const pin = (p, cls) => {
    const el = document.createElement('div');
    el.className = 'pin ' + cls;
    el.textContent = p.label;
    const m = new maplibregl.Marker({ element: el }).setLngLat([p.lng, p.lat]).addTo(map);
    resultMarkers.push(m);
  };
  for (const g of guesses) pin(g, '');
  pin(truth, 'truth');
  map.addSource('lines', { type: 'geojson', data: { type: 'FeatureCollection', features: guesses.map(g => ({
    type: 'Feature', geometry: { type: 'LineString', coordinates: [[g.lng, g.lat], [truth.lng, truth.lat]] } })) } });
  map.addLayer({ id: 'lines', type: 'line', source: 'lines',
    paint: { 'line-color': '#000', 'line-width': 2, 'line-dasharray': [2, 2] } });
  const b = new maplibregl.LngLatBounds([truth.lng, truth.lat], [truth.lng, truth.lat]);
  for (const g of guesses) b.extend([g.lng, g.lat]);
  document.getElementById('pickhint').style.display = 'none';
  openMap(true);
  map.fitBounds(b, { padding: 60, maxZoom: 12, duration: 0 });
}

/// A random picture of one of [sources] (guessing rounds).
async function randomPicture(sources) {
  for (let attempt = 0; attempt < 25; attempt++) {
    const src = pick(sources);
    const seeds = src === 'panoramax' && attempt % 2 === 0 ? SEEDS_FR : SEEDS;
    const [lat0, lng0] = pick(seeds);
    // Somewhere within ~30 km of the seed (KartaView only searches 500 m
    // around a point: close to the centre then).
    const spread = src === 'kartaview' ? 0.03 : 0.5;
    const lat = lat0 + (Math.random() - 0.5) * spread;
    const lng = lng0 + (Math.random() - 0.5) * spread / Math.max(0.2, Math.cos(lat0 * Math.PI / 180));
    try {
      let list = [];
      if (src === 'google') {
        const g = await googleNear(lng, lat, 5000);
        if (g) list = [g];
      } else if (src === 'mapillary') {
        list = await mapillaryNear(lng, lat, [0.02, 0.05], true);
        if (!list.length) list = await mapillaryNear(lng, lat, [0.02], false);
      } else {
        list = src === 'kartaview'
          ? await kartaviewNear(lng, lat, [0.0045])
          : await panoramaxNear(lng, lat, [0.02, 0.05]);
        const round = list.filter(x => x.is360);
        if (round.length) list = round;
      }
      if (list.length) {
        const x = pick(list);
        return { src: x.src, id: x.id, lat: x.c[1], lng: x.c[0], h: 0, p: 0, z: 0,
          cc: await countryOf(x.c[1], x.c[0]) };
      }
    } catch (e) {}
  }
  throw new Error('Kein Ort mit Bildern gefunden');
}

// ------------------------------------------------------------- messages

async function receive(json) {
  const m = typeof json === 'string' ? JSON.parse(json) : json;
  const reply = (o) => send(Object.assign({ t: 'reply', req: m.req }, o));
  try {
    switch (m.t) {
      case 'init': {
        cfg = m;
        const missing = cfg.sources.find(s => !PHOTOS.includes(s) && !(cfg.keys || {})[s]);
        if (missing) { send({ t: 'error', msg: 'Kein Schlüssel für ' + missing }); return; }
        if (cfg.mode === 'hunt') await huntMap();
        else if (cfg.mode === 'guess') await guessMap();
        send({ t: 'ready' });
        break;
      }
      case 'mark': {
        if (!current) { reply({ error: 'Erst einen Ort auf der Karte wählen' }); return; }
        if (photo.loading) { reply({ error: 'Das Bild lädt noch …' }); return; }
        const v = await currentView();
        v.cc = await countryOf(v.lat, v.lng);
        reply({ view: v });
        break;
      }
      case 'show':
        clearResult();
        if (guessMarker) { guessMarker.remove(); guessMarker = null; }
        if (cfg.mode === 'guess') {
          document.getElementById('pickhint').style.display = 'block';
          openMap(false);
        }
        await showPicture(m.view);
        if (cfg.mode === 'guess') openMap(false);
        break;
      case 'guess': {
        if (!guessMarker) { reply({ error: 'Tippe erst auf der Karte, wo du das Bild vermutest' }); return; }
        const ll = guessMarker.getLngLat();
        reply({ lat: ll.lat, lng: ll.lng });
        break;
      }
      case 'result':
        showResult(m.truth, m.guesses || []);
        break;
      case 'goto':
        if (map && map.jumpTo) map.jumpTo({ center: [m.lng, m.lat], zoom: 16 });
        else if (map) { map.setCenter({ lat: m.lat, lng: m.lng }); map.setZoom(16); }
        await huntPick(m.lng, m.lat, [0.001, 0.005, 0.02]);
        break;
      case 'random':
        reply({ view: await randomPicture(m.sources) });
        break;
    }
  } catch (e) {
    const msg = String(e && e.message || e);
    if (m.req) reply({ error: msg }); else send({ t: 'error', msg });
  }
}

window.geobingo = { receive };
window.addEventListener('message', (e) => {
  if (e.data && typeof e.data.geobingoIn === 'string') receive(e.data.geobingoIn);
});
send({ t: 'loaded' });
