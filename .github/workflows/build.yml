name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::Code is not formatted (dart format)"
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    # A normal build takes ~15 min; fail fast instead of hanging.
    timeout-minutes: 45
    env:
      HAS_PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Configure release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Release keystore configured."
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret – APK is signed with a debug key, no Play Store bundle."
          fi
      - run: flutter pub get
      - name: Build APK
        run: >-
          flutter build apk --release --build-number=${{ github.run_number }}
          --dart-define=REPORT_EMAIL=${{ vars.REPORT_EMAIL }}
          --dart-define=ADMIN_PUBKEYS=${{ vars.ADMIN_PUBKEYS }}
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MobileGames-${{ github.run_number }}.apk
      # Google Play: app bundle without the background service
      # (see android/app/src/play/AndroidManifest.xml).
      # Only with the release key: Google rejects debug-signed bundles.
      - name: Build Play Store bundle
        if: env.HAS_KEYSTORE == 'true'
        run: >-
          flutter build appbundle --release --build-number=${{ github.run_number }}
          --dart-define=PLAY_STORE=true
          --dart-define=REPORT_EMAIL=${{ vars.REPORT_EMAIL }}
          --dart-define=ADMIN_PUBKEYS=${{ vars.ADMIN_PUBKEYS }}
          --android-project-arg=playStore=true
      - name: Rename bundle
        if: env.HAS_KEYSTORE == 'true'
        run: mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/flutter-apk/MobileGames-${{ github.run_number }}-PlayStore.aab
      # Automatic upload to the internal test track of Google Play. Needs the
      # secret PLAY_SERVICE_ACCOUNT_JSON (service account with release rights
      # in the Play Console). Only for pushes to main; a failed upload is
      # shown as a warning but does not stop the GitHub release.
      - name: Upload to Google Play (internal testing)
        if: >-
          env.HAS_KEYSTORE == 'true' && env.HAS_PLAY_JSON == 'true' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.sommer.mobilegames
          releaseFiles: build/app/outputs/flutter-apk/MobileGames-${{ github.run_number }}-PlayStore.aab
          tracks: internal
          # Release notes for testers (max. 500 characters, one file per
          # language). Update the file with every release worth noting.
          whatsNewDirectory: distribution/whatsnew
          # "draft" until the first release was rolled out by hand.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
      - uses: actions/upload-artifact@v4
        with:
          name: MobileGames-android
          path: |
            build/app/outputs/flutter-apk/MobileGames-*.apk
            build/app/outputs/flutter-apk/MobileGames-*.aab

  ios:
    name: iOS (unsigned)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS app without code signing
        run: >-
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
          --dart-define=REPORT_EMAIL=${{ vars.REPORT_EMAIL }}
          --dart-define=ADMIN_PUBKEYS=${{ vars.ADMIN_PUBKEYS }}
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr MobileGames-${{ github.run_number }}-iOS-iPadOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MobileGames-ios-unsigned
          path: MobileGames-*-iOS-iPadOS-unsigned.ipa

  linux:
    name: Linux (.deb, .tar.gz)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev \
            libsecret-1-dev libasound2-dev libpulse-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Test Switch game rules
        run: |
          sudo apt-get install -y -qq libsdl2-dev libsdl2-ttf-dev
          make -C switch -f Makefile.pc test
      - name: Build Linux app
        run: >
          flutter build linux --release --build-number=${{ github.run_number }}
          --dart-define=REPORT_EMAIL=${{ vars.REPORT_EMAIL }}
          --dart-define=ADMIN_PUBKEYS=${{ vars.ADMIN_PUBKEYS }}
      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/MobileGames-${{ github.run_number }}-Linux-x64.tar.gz \
            -C build/linux/x64/release bundle --transform 's,^bundle,MobileGames,'
          packaging/linux/make_deb.sh "$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')-${{ github.run_number }}" \
            dist/MobileGames-${{ github.run_number }}-Linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: MobileGames-linux
          path: dist/*

  windows:
    name: Windows (Installer)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Windows app
        run: >
          flutter build windows --release --build-number=${{ github.run_number }}
          --dart-define=REPORT_EMAIL=${{ vars.REPORT_EMAIL }}
          --dart-define=ADMIN_PUBKEYS=${{ vars.ADMIN_PUBKEYS }}
      - name: Add Visual C++ runtime
        # So the app also starts on PCs without the VC++ redistributable.
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build\windows\x64\runner\Release\
          }
      - name: Package installer and portable zip
        shell: pwsh
        run: |
          $n = '${{ github.run_number }}'
          $v = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -replace 'version:\s*','' -replace '\+.*','') + ".$n"
          New-Item -ItemType Directory -Force dist | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$v" "/DOutputName=MobileGames-$n-Windows-Setup" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\MobileGames-$n-Windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MobileGames-windows
          path: dist/*

  macos:
    name: macOS (.dmg, Homebrew)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build macOS app
        run: >
          flutter build macos --release --build-number=${{ github.run_number }}
          --dart-define=REPORT_EMAIL=${{ vars.REPORT_EMAIL }}
          --dart-define=ADMIN_PUBKEYS=${{ vars.ADMIN_PUBKEYS }}
      - name: Package dmg and zip
        run: |
          n=${{ github.run_number }}
          app="build/macos/Build/Products/Release/Mobile Games.app"
          # Ad-hoc signature (no paid Apple account): runs after removing
          # the quarantine flag or via right click → Open.
          codesign --force --deep --sign - "$app"
          mkdir -p dist dmg
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Mobile Games" -srcfolder dmg -ov -format UDZO "dist/MobileGames-$n-macOS.dmg"
          # Fixed name for the Homebrew cask (releases/latest/download/…).
          ditto -c -k --keepParent "$app" dist/MobileGames-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MobileGames-macos
          path: dist/*

  switch:
    name: Nintendo Switch (Homebrew .nro)
    needs: test
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 for the Switch
        run: dkp-pacman -Sy --noconfirm --needed switch-sdl2 switch-sdl2_ttf
      - name: Build MobileGames.nro
        working-directory: switch
        run: make -j"$(nproc)" APP_VERSION=1.1.${{ github.run_number }}
      - run: |
          mkdir -p dist
          cp switch/MobileGames.nro dist/MobileGames-${{ github.run_number }}-Switch.nro
      - uses: actions/upload-artifact@v4
        with:
          name: MobileGames-switch
          path: dist/*

  web:
    name: Web-App (GitHub Pages)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build web app
        # CanvasKit is bundled (no CDN), so the app also starts offline.
        run: >
          flutter build web --release --no-web-resources-cdn
          --base-href /${{ github.event.repository.name }}/
          --build-number=${{ github.run_number }}
          --dart-define=REPORT_EMAIL=${{ vars.REPORT_EMAIL }}
          --dart-define=ADMIN_PUBKEYS=${{ vars.ADMIN_PUBKEYS }}
      - name: Add privacy policy
        run: cp docs/datenschutz.html build/web/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
          # Own name per attempt, so re-running the job works too.
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deploy
        # Needs Settings → Pages → Source "GitHub Actions" once.
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - if: steps.deploy.outcome == 'failure'
        run: echo "::warning::GitHub Pages ist nicht aktiviert (Settings → Pages → Source → GitHub Actions)."

  release:
    name: GitHub Release
    needs: [android, ios, linux, windows, macos, switch]
    # A failed desktop build must not hold back the phone apps.
    if: >-
      !cancelled() && needs.android.result == 'success' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Mobile Games ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Automatisch gebaut aus ${{ github.sha }}.

            **Android (ab Android 10):** `MobileGames-${{ github.run_number }}.apk` herunterladen und installieren
            (Installation aus unbekannten Quellen erlauben).

            **iPhone & iPad (iOS/iPadOS):** `MobileGames-${{ github.run_number }}-iOS-iPadOS-unsigned.ipa` ist eine
            universelle, aber **unsignierte** App. Sie muss vor der Installation signiert werden, z. B. mit
            AltStore, Sideloadly oder einem Apple-Developer-Account.

            **Windows:** `MobileGames-${{ github.run_number }}-Windows-Setup.exe` installieren (ohne
            Admin-Rechte). Die App ist nicht signiert: bei der SmartScreen-Warnung auf „Weitere Informationen“
            → „Trotzdem ausführen“. Ohne Installation: `…-Windows-portable.zip` entpacken.

            **macOS (ab 12):** `MobileGames-${{ github.run_number }}-macOS.dmg` öffnen und in „Programme“ ziehen.
            Nicht notarisiert: beim ersten Start Rechtsklick → „Öffnen“. Oder per Homebrew:
            `brew tap sommer2019/mobilegames https://github.com/Sommer2019/MobileGames && brew install --cask mobile-games`

            **Linux:** `MobileGames-${{ github.run_number }}-Linux-amd64.deb` (Debian/Ubuntu:
            `sudo apt install ./MobileGames-…deb`) oder `…-Linux-x64.tar.gz` entpacken und `MobileGames/mobile_games` starten.

            **Nintendo Switch (Homebrew, Custom Firmware nötig):** `MobileGames-${{ github.run_number }}-Switch.nro`
            nach `sdmc:/switch/` auf die SD-Karte kopieren und im Homebrew-Menü starten. Offline:
            Snake, 4 gewinnt, Dame und Würfelbecher.

            **Google Play:** `MobileGames-${{ github.run_number }}-PlayStore.aab` ist das App-Bundle zum
            Hochladen in die Play Console (nicht direkt installierbar).
          files: |
            dist/*.apk
            dist/*.aab
            dist/*.ipa
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.tar.gz
            dist/*.nro
